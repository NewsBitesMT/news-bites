name: News Bites updates
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which update to generate'
        type: choice
        options: [morning, afternoon]
        default: morning
  schedule:
    - cron: '55 5 * * *'
      timezone: 'Europe/Malta'
    - cron: '0 16 * * *'
      timezone: 'Europe/Malta'
permissions:
  contents: write
concurrency:
  group: news-bites
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and curate RSS news
        env:
          NEWS_BITES_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || (github.event.schedule == '0 16 * * *' && 'afternoon' || 'morning') }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/build.py
      - name: Save published edition if changed
        run: |
          git config user.name 'news-bites-bot'
          git config user.email 'news-bites-bot@users.noreply.github.com'
          git add index.html edition.json
          if ! git diff --cached --quiet; then git commit -m 'Update News Bites source preview'; git push; fi
