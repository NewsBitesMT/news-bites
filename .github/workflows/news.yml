name: News Bites updates
on:
  workflow_dispatch:
  schedule:
    - cron: '55 5 * * *'
      timezone: 'Europe/Malta'
    - cron: '0 16 * * *'
      timezone: 'Europe/Malta'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: news-bites
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch publisher feeds and build edition
        run: python scripts/build.py
      - name: Save published edition
        run: |
          git config user.name 'news-bites-bot'
          git config user.email 'news-bites-bot@users.noreply.github.com'
          git add index.html edition.json
          if ! git diff --cached --quiet; then git commit -m 'Update News Bites source preview'; git push; fi
